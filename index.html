let current = 0;
let answers = [];
let selectedQuestions = [];

const qText = document.getElementById("questionText");
const progress = document.getElementById("progress");
const wrapper = document.getElementById("inputWrapper");
const errorText = document.getElementById("errorText");

function showQuestion(){
  errorText.style.display = "none";

  if(current === 0){
    qText.innerText = firstQuestion;
    progress.innerText = "Question 1 of ?";
    wrapper.innerHTML = `
      <select id="answerInput">
        <option value="">-- Please select a position --</option>
        <option value="Remote Administrative & Billing Assistant">Remote Administrative & Billing Assistant</option>
        <option value="Remote Personal Assistant">Remote Personal Assistant</option>
        <option value="Remote Community Support Coordinator">Remote Community Support Coordinator</option>
		<option value="Remote Assistant Procurement & Client Order Coordinator">Remote Assistant Procurement & Client Order Coordinator</option>
        <option value="Remote Data Entry Clerk">Remote Data Entry Clerk</option>
        <option value="Remote Customer Service Representative">Remote Customer Service Representative</option>
        <option value="Remote Order Processor">Remote Order Processor</option>
        <option value="Remote Administrative/Customer Operations Coordinator">Remote Administrative/Customer Operations Coordinator</option>
        <option value="Delivery Driver">Delivery Driver</option>
      </select>
    `;
  } else {
    qText.innerText = selectedQuestions[current-1];
    progress.innerText = "Question " + (current+1) + " of " + (selectedQuestions.length+1);
    wrapper.innerHTML = `<input id="answerInput" />`;
  }

  document.getElementById("answerInput").focus();
}

function nextQuestion(){
  const answer = document.getElementById("answerInput").value;
  if(!answer){
    errorText.style.display = "block";
    return;
  }

  answers.push(answer);

  if(current === 0){
    if(answer === "Remote Personal Assistant") selectedQuestions = paQuestions;
    else if(answer === "Remote Data Entry Clerk") selectedQuestions = dataEntryQuestions;
    else if(answer === "Remote Customer Service Representative") selectedQuestions = csrQuestions;
    else if(answer === "Remote Order Processor") selectedQuestions = orderProcessorQuestions;
    else if(answer === "Remote Administrative/Customer Operations Coordinator") selectedQuestions = adminOpsQuestions;
    else if(answer === "Delivery Driver") selectedQuestions = driverQuestions;
    else if(answer === "Remote Community Support Coordinator") selectedQuestions = communitySupportQuestions;
	else if(answer === "Remote Assistant Procurement & Client Order Coordinator") selectedQuestions = assistantProcurementQuestions;
    else selectedQuestions = adminQuestions;
  }

  current++;

  if(current < selectedQuestions.length + 1){
    showQuestion();
  } else {
    submitInterview();
  }
}

function submitInterview(){
  document.querySelector(".container").innerHTML = "<h2>Submitting your interview...</h2>";

  let message = "Position Applied For: " + answers[0] + "\n\n";
  for(let i=1;i<answers.length;i++){
    message += selectedQuestions[i-1] + "\nAnswer: " + answers[i] + "\n\n";
  }

  emailjs.send(
    "service_cwzrlga",
    "template_lgzkb7s",
    { interview_answers: message }
  )
  .then(()=>{
    document.querySelector(".container").innerHTML = `
      <h2>✅ Interview Submitted</h2>
      <p>Thank you for taking the time to complete this interview. We appreciate your interest in <strong>THE FURNITURE TEAM, LLC</strong>.</p>
      <p>Please complete the background check using the link below:</p>
      <p>👉 <a href="https://verification-portal.manufacturerssteel.com" target="_blank">
      https://verification-portal.manufacturerssteel.com</a></p>
      <p>If you are selected to move forward, a member of our recruitment team may contact you by phone at our official THE FURNITURE TEAM, LLC, number: <strong>(840) 242-7954</strong>.</p>
      <p><strong>We look forward to potentially welcoming you to our team.</strong></p>
    `;
  });
}
